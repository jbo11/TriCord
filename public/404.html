<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TriCord</title>
  </head>
  <body>
    <script>
      (function () {
        var key = 'tricord_redirect_path';
        var target = window.location.pathname + window.location.search + window.location.hash;
        var base = window.location.pathname.indexOf('/TriCord/') === 0 ? '/TriCord/' : '/';
        window.sessionStorage.setItem(key, target);
        window.location.replace(base);
      })();
    </script>
  </body>
</html>
