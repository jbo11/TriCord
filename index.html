    <script>
      (function () {
        try {
          var redirectPath = window.sessionStorage.getItem("tricord_redirect_path");
          if (!redirectPath) return;
          window.sessionStorage.removeItem("tricord_redirect_path");
          if (redirectPath !== window.location.pathname + window.location.search + window.location.hash) {
            window.history.replaceState({}, "", redirectPath);
          }
        } catch (error) {
          // Ignore private browsing storage failures.
        }
      })();
    </script>
